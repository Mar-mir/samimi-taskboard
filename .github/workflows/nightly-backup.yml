name: nightly-backup
permissions:
  contents: write
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: export tasks
        run: |
          curl -s -m 60 -H "X-Backup-Token: ${{ secrets.BACKUP_TOKEN }}" \
            "${{ secrets.WORKER_URL }}/api/export" -o /tmp/export.json
          python3 -c "import json;d=json.load(open('/tmp/export.json'));assert d.get('ok'),d;open('tasks-backup.json','w').write(json.dumps(d,ensure_ascii=False,indent=2))"
      - name: commit if changed
        run: |
          git config user.name "taskboard-backup"
          git config user.email "taskboard-backup@users.noreply.github.com"
          git add tasks-backup.json
          git diff --cached --quiet || { git commit -m "backup $(date -u +%F)"; git push; }
